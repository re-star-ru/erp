{{ define "scripts" }}
<meta name="robots" content="noindex, nofollow" />
<style>[x-cloak]{display:none!important}</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
{{ end }}

{{ define "main" }}
<div class="pt-4 pb-12" x-data="catalog()" x-cloak>

  <div class="container mx-auto max-w-5xl p-4 flex">
    <div class="flex-1 text-xl inline-block border-2 rounded-l-md border-yellow-400 shadow-xl">
      <input
        class="w-full pl-2 py-2 rounded-md outline-none"
        type="search"
        placeholder="Номер запчасти..."
        x-model="text"
        @keydown.enter="search()"
      />
    </div>
    <button
      @click="search()"
      class="bg-yellow-400 pl-2 pr-8 py-2 rounded-l-none rounded-r-md shadow-xl cursor-pointer transition duration-300 ease-out hover:bg-yellow-500"
    >
      <svg
        :class="loading ? 'opacity-100' : 'opacity-0'"
        class="inline align-text-bottom mr-2 w-5 h-5 animate-spin fill-gray-600 transition-opacity"
        viewBox="0 0 100 101"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
        <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
      </svg>
      Найти
    </button>
  </div>

  <div x-show="error" x-transition class="relative mx-auto max-w-xl px-4">
    <div class="flex p-4 mb-4 text-sm text-yellow-700 bg-yellow-100 rounded-lg" role="alert">
      <svg class="inline flex-shrink-0 mr-3 w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
      </svg>
      <span class="font-medium">Ошибка на сервере!</span>
    </div>
  </div>

  <div class="container mx-auto max-w-3xl px-4 pb-2 border-b border-gray-200">
    <div class="inline-block p-1 rounded-lg bg-white border">
      <span class="cursor-pointer" @click="inStock = !inStock">
        В наличии
        <span :class="inStock ? 'opacity-100' : 'opacity-0'" class="transition-opacity">✅</span>
      </span>
    </div>
  </div>

  <ul class="p-4 flex flex-wrap gap-4 justify-center">
    <template x-for="card in items" :key="card.id">
      <li class="max-w-sm bg-white rounded-lg shadow-md p-4">
        <template x-for="img in card.images" :key="img.path">
          <img :src="'https://s3.re-star.ru/' + img.path" :alt="card.name" class="rounded-t-lg" />
        </template>
        <h3
          class="pt-4 text-xl font-semibold tracking-tight text-gray-900"
          x-text="card.type + ' ' + card.name + ', ' + card.char"
        ></h3>
        <h4 class="pt-2 font-semibold text-gray-900" x-text="'Арт. ' + card.sku"></h4>
        <h4 class="font-bold text-gray-900" x-text="'В наличии ' + card.amount + ' шт.'"></h4>
      </li>
    </template>
  </ul>

</div>

<script>
function catalog() {
  return {
    text: '',
    items: [],
    loading: false,
    error: false,
    inStock: true,

    async search() {
      this.loading = true
      this.error = false
      try {
        const resp = await fetch('https://api.re-star.ru/v1/oprox/search/' + encodeURIComponent(this.text))
        if (!resp.ok) throw new Error(resp.status)
        this.items = await resp.json()
      } catch (e) {
        this.error = true
        setTimeout(() => { this.error = false }, 3000)
      }
      this.loading = false
    }
  }
}
</script>
{{ end }}
